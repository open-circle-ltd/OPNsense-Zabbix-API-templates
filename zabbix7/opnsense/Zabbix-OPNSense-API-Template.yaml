zabbix_export:
  version: '7.2'
  template_groups:
    - uuid: 36bff6c29af64692839d077febfc7079
      name: 'Templates/Network devices'
  templates:
    - uuid: c856c5fdba7e44d9a1a287b0ff94c433
      template: OPNSENSE-BY-API
      name: OPNSENSE-BY-API
      description: |
        Customized version from https://github.com/open-circle-ltd/OPNsense-Zabbix-API-templates/tree/exu-features
        
        Zabbix Custom Templates from https://github.com/sysadminbr/zabbix-templates
        
        Templates for monitoring opnSense by api
        set macros
        
            {$APIKEY} System: Access: Users: Api key
        
            {$APISECRET} System: Access: Users: Api secret
        
            {$BASEURL} Full url like https://my.opnsense.com
        
            {$FIREWALL.CHANGE.THRESHOLD} default is 50 (percent), used by trigger which notifies if significant change
        
        make sure that the user has to right diagnostic permissions on opnSense
      templates:
        - name: 'OCC - FreeBSD by Zabbix agent'
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: 0a43c0a1b9b0428d8ebb644545dad214
          name: 'CPU utilization'
          type: CALCULATED
          key: 'cpu.util[percent]'
          history: 7d
          value_type: FLOAT
          units: '%'
          params: '100 - last(/{HOST.HOST}/system.cpu.util[,idle])'
          tags:
            - tag: component
              value: cpu
        - uuid: 8dc34c94995c4b518f6271415cbb83ef
          name: 'Firewall Block Actions'
          type: DEPENDENT
          key: opnsense.firewall.block
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
            - type: JAVASCRIPT
              parameters:
                - |
                  var input = JSON.parse(value);
                  for (var i = 0; i < input.length; i++) {
                      if (input[i].label === "block") {
                          return input[i].value;
                      }
                  }
                  return 0;
          master_item:
            key: opnsense.firewall.stats
          tags:
            - tag: component
              value: firewall
          triggers:
            - uuid: d641f23d13e14613af4a3a0e6ce782c9
              expression: '(last(/OPNSENSE-BY-API/opnsense.firewall.block)-avg(/OPNSENSE-BY-API/opnsense.firewall.block,10m))/avg(/OPNSENSE-BY-API/opnsense.firewall.block,10m)*100>{$FIREWALL.CHANGE.THRESHOLD}'
              name: 'Significant increase in firewall block actions'
              event_name: 'Significant increase in firewall block actions (>{$FIREWALL.CHANGE.THRESHOLD}%)'
              opdata: 'Block actions: {ITEM.LASTVALUE}'
              priority: WARNING
              description: 'Firewall block actions increased by more than {$FIREWALL.CHANGE.THRESHOLD}% compared to 10-minute average'
        - uuid: 7cb46709b5164ab5906158164fdead93
          name: 'Firewall Pass Actions'
          type: DEPENDENT
          key: opnsense.firewall.pass
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
            - type: JAVASCRIPT
              parameters:
                - |
                  var input = JSON.parse(value);
                  for (var i = 0; i < input.length; i++) {
                      if (input[i].label === "pass") {
                          return input[i].value;
                      }
                  }
                  return 0;
          master_item:
            key: opnsense.firewall.stats
          tags:
            - tag: component
              value: firewall
          triggers:
            - uuid: be5a04d03e334c8d94bf6e9592edd4cd
              expression: '(last(/OPNSENSE-BY-API/opnsense.firewall.pass)-avg(/OPNSENSE-BY-API/opnsense.firewall.pass,10m))/avg(/OPNSENSE-BY-API/opnsense.firewall.pass,10m)*100>{$FIREWALL.CHANGE.THRESHOLD}'
              name: 'Significant increase in firewall pass actions'
              event_name: 'Significant increase in firewall pass actions (>{$FIREWALL.CHANGE.THRESHOLD}%)'
              opdata: 'Pass actions: {ITEM.LASTVALUE}'
              priority: INFO
              description: 'Firewall pass actions increased by more than {$FIREWALL.CHANGE.THRESHOLD}% compared to 10-minute average'
        - uuid: c702632342144c00b4937946bb852e85
          name: 'Firewall Redirect Actions'
          type: DEPENDENT
          key: opnsense.firewall.rdr
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
            - type: JAVASCRIPT
              parameters:
                - |
                  var input = JSON.parse(value);
                  for (var i = 0; i < input.length; i++) {
                      if (input[i].label === "rdr") {
                          return input[i].value;
                      }
                  }
                  return 0;
          master_item:
            key: opnsense.firewall.stats
          tags:
            - tag: component
              value: firewall
          triggers:
            - uuid: 69aa4a5bf4df4f78bd6643e2d1e29f99
              expression: '(last(/OPNSENSE-BY-API/opnsense.firewall.rdr)-avg(/OPNSENSE-BY-API/opnsense.firewall.rdr,10m))/avg(/OPNSENSE-BY-API/opnsense.firewall.rdr,10m)*100>{$FIREWALL.CHANGE.THRESHOLD}'
              name: 'Significant increase in firewall redirect actions'
              event_name: 'Significant increase in firewall redirect actions (>{$FIREWALL.CHANGE.THRESHOLD}% for 10m)'
              opdata: 'Redirect actions: {ITEM.LASTVALUE}'
              priority: INFO
              description: 'Firewall redirect actions increased by more than {$FIREWALL.CHANGE.THRESHOLD}% compared to 10-minute average'
        - uuid: 37a8583901e14ffb9081d0ff9511216f
          name: 'Get Firewall Statistics'
          type: HTTP_AGENT
          key: opnsense.firewall.stats
          delay: 10s
          history: 1h
          value_type: TEXT
          authtype: BASIC
          username: '{$APIKEY}'
          password: '{$APISECRET}'
          description: 'Firewall block/pass statistics'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
          timeout: 5s
          url: '{$BASEURL}/api/diagnostics/firewall/stats?group_by=action'
          tags:
            - tag: component
              value: raw
        - uuid: 6d87b7459607448fbd6d2ec2fd44e1f3
          name: 'Firmware Version'
          type: DEPENDENT
          key: opnsense.firmware.current
          history: 30d
          value_type: CHAR
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
            - type: JSONPATH
              parameters:
                - $.product.product_version
          master_item:
            key: opnsense.firmware.status
          tags:
            - tag: component
              value: os
        - uuid: b590fde958314341ac4b951c34ba0456
          name: 'Firmware Latest'
          type: DEPENDENT
          key: opnsense.firmware.latest
          history: 30d
          value_type: CHAR
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
            - type: JSONPATH
              parameters:
                - $.product.product_latest
          master_item:
            key: opnsense.firmware.status
          tags:
            - tag: component
              value: os
        - uuid: 70e1f07d5cd041a0ba3b48d643a46139
          name: 'Get Firmware Status'
          type: HTTP_AGENT
          key: opnsense.firmware.status
          delay: 1h
          history: 1d
          value_type: TEXT
          authtype: BASIC
          username: '{$APIKEY}'
          password: '{$APISECRET}'
          description: 'Get firmware info'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
          timeout: 10s
          url: '{$BASEURL}/api/core/firmware/status'
          tags:
            - tag: component
              value: raw
        - uuid: ff720ef670694acd834db3e8d69d2de0
          name: 'Get Gateways Status'
          type: HTTP_AGENT
          key: opnsense.gateways.status
          history: 1h
          value_type: TEXT
          authtype: BASIC
          username: '{$APIKEY}'
          password: '{$APISECRET}'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
          timeout: 10s
          url: '{$BASEURL}/api/routes/gateway/status'
          tags:
            - tag: component
              value: raw
          triggers:
            - uuid: 777c7080ef6e4f3aaaf3bdcfc949bfa4
              expression: 'nodata(/OPNSENSE-BY-API/opnsense.gateways.status,{$AGENT.TIMEOUT})=1'
              name: 'Unavailable via API'
              event_name: 'Unavailable via API (for {$AGENT.TIMEOUT})'
              priority: AVERAGE
              description: 'Firewall became unreachable by http API'
              manual_close: 'YES'
        - uuid: 381ec8a82e15406a8e3d719577cca698
          name: 'Get Interface Statistics'
          type: HTTP_AGENT
          key: opnsense.interface.statistics
          history: 1h
          value_type: TEXT
          authtype: BASIC
          username: '{$APIKEY}'
          password: '{$APISECRET}'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
          timeout: 5s
          url: '{$BASEURL}/api/diagnostics/interface/get_interface_statistics'
          tags:
            - tag: component
              value: raw
        - uuid: 9d9b53b496c14b8eb31138ccc7020beb
          name: 'Get IPSec Tunnels'
          type: HTTP_AGENT
          key: opnsense.ipsec.tunnels
          history: 1h
          value_type: TEXT
          authtype: BASIC
          username: '{$APIKEY}'
          password: '{$APISECRET}'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
          timeout: 10s
          url: '{$BASEURL}/api/ipsec/sessions/searchPhase1'
          tags:
            - tag: component
              value: raw
        - uuid: 3066565299434e9b9dbfa7dfee6f9712
          name: 'Get OpenVPN Statistics'
          type: HTTP_AGENT
          key: opnsense.openvpn.statistics
          history: 1h
          value_type: TEXT
          authtype: BASIC
          username: '{$APIKEY}'
          password: '{$APISECRET}'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
          timeout: 10s
          url: '{$BASEURL}/api/openvpn/service/searchSessions'
          tags:
            - tag: component
              value: raw
        - uuid: 419871d2614649dc87a088b2d60ba943
          name: 'Get Services'
          type: HTTP_AGENT
          key: opnsense.service.get
          history: 1h
          value_type: TEXT
          authtype: BASIC
          username: '{$APIKEY}'
          password: '{$APISECRET}'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
          timeout: 5s
          url: '{$BASEURL}/api/core/service/search'
          tags:
            - tag: component
              value: raw
        - uuid: 9ab4f75651d348909b7576690d8cfd9f
          name: 'Get Wireguard Status'
          type: HTTP_AGENT
          key: opnsense.wireguard.status
          history: 1h
          value_type: TEXT
          authtype: BASIC
          username: '{$APIKEY}'
          password: '{$APISECRET}'
          preprocessing:
            - type: CHECK_NOT_SUPPORTED
              parameters:
                - '-1'
          timeout: 10s
          url: '{$BASEURL}/api/wireguard/service/show'
          tags:
            - tag: component
              value: raw
        - uuid: da9a81155ca249ba94a7b83565576768
          name: 'Memory utilization'
          key: 'vm.memory.size[pused]'
          history: 7d
          value_type: FLOAT
          units: '%'
          tags:
            - tag: component
              value: memory
      discovery_rules:
        - uuid: 6d12368211f64235a719c734cdde06ec
          name: 'Gateways Discovery'
          type: DEPENDENT
          key: opnsense.gateway.discovery
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: 48bde6b0e032459c8d5f558eb8f90cf7
              name: 'Gateway {#GWNAME}: Address'
              type: DEPENDENT
              key: 'opnsense.gateway.get[{#GWNAME}, address]'
              value_type: CHAR
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var input = JSON.parse(value);
                      for(var i in input["items"]) {
                          if(input["items"][i]["name"] == "{#GWNAME}"){
                              return input["items"][i]["address"];
                          }
                      }
              master_item:
                key: opnsense.gateways.status
              tags:
                - tag: component
                  value: gateway
              trigger_prototypes:
                - uuid: bac7234301624efc90ec590159b97dbd
                  expression: 'change(/OPNSENSE-BY-API/opnsense.gateway.get[{#GWNAME}, address])=1'
                  name: 'Gateway {#GWNAME} address changed'
                  priority: WARNING
            - uuid: 8781228217fd4311beaf28e8ecc74788
              name: 'Gateway {#GWNAME}: Delay'
              type: DEPENDENT
              key: 'opnsense.gateway.get[{#GWNAME},delay]'
              value_type: FLOAT
              units: ms
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var input = JSON.parse(value);
                      for(var i in input["items"]) {
                          if(input["items"][i]["name"] == "{#GWNAME}"){
                              return input["items"][i]["delay"] == "~" ? null : input["items"][i]["delay"];
                          }
                      }
                - type: RTRIM
                  parameters:
                    - 'ms ~'
              master_item:
                key: opnsense.gateways.status
              tags:
                - tag: component
                  value: gateway
            - uuid: 7cce16df73634e7baf7cc7f690bfd16d
              name: 'Gateway {#GWNAME}: Loss'
              type: DEPENDENT
              key: 'opnsense.gateway.get[{#GWNAME},loss]'
              value_type: FLOAT
              units: '%'
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var input = JSON.parse(value);
                      for(var i in input["items"]) {
                          if(input["items"][i]["name"] == "{#GWNAME}"){
                              return input["items"][i]["loss"] == "~" ? null : input["items"][i]["loss"];
                          }
                      }
                - type: TRIM
                  parameters:
                    - '% ~'
              master_item:
                key: opnsense.gateways.status
              tags:
                - tag: component
                  value: gateway
            - uuid: ef193b6f2fc54e259201dbe4dfdea5ba
              name: 'Gateway {#GWNAME}: Status'
              type: DEPENDENT
              key: 'opnsense.gateway.get[{#GWNAME},status]'
              valuemap:
                name: 'Gateway Status'
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var input = JSON.parse(value);
                      var map = {"Online": 0, "Packetloss": 1, "Latency": 2, "Latency, Packetloss": 3, "Offline": 4, "Offline (forced)": 5, "Pending": 6}
                      var iret = -1;
                      for(var i in input["items"]) {
                          if(input["items"][i]["name"] == "{#GWNAME}"){
                              iret = map[input["items"][i]["status_translated"]];
                              break;
                          }
                      }
                      return iret;
              master_item:
                key: opnsense.gateways.status
              tags:
                - tag: component
                  value: gateway
              trigger_prototypes:
                - uuid: 4c9c0274c10b488891f858a97769b0a7
                  expression: 'avg(/OPNSENSE-BY-API/opnsense.gateway.get[{#GWNAME},status],3m)=4'
                  name: 'Gateway {#GWNAME} is down'
                  priority: WARNING
                - uuid: cab4fecf581d4846a28d9e22cf01a1ac
                  expression: 'avg(/OPNSENSE-BY-API/opnsense.gateway.get[{#GWNAME},status],3m)=2'
                  name: 'Gateway {#GWNAME} with delay'
                  priority: WARNING
                - uuid: 36eda2c369414033a2adeba2068416e9
                  expression: 'avg(/OPNSENSE-BY-API/opnsense.gateway.get[{#GWNAME},status],3m)=3'
                  name: 'Gateway {#GWNAME} with delay and loss'
                  priority: WARNING
                - uuid: cbf7c5cf056641d6a4fd164a146d868f
                  expression: 'avg(/OPNSENSE-BY-API/opnsense.gateway.get[{#GWNAME},status],3m)=1'
                  name: 'Gateway {#GWNAME} with packet loss'
                  priority: WARNING
            - uuid: fcdd1f2d9c674f1b9fb7e6e368f88ba8
              name: 'Gateway {#GWNAME}: Stddev'
              type: DEPENDENT
              key: 'opnsense.gateway.get[{#GWNAME},stddev]'
              value_type: FLOAT
              units: ms
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var input = JSON.parse(value);
                      for(var i in input["items"]) {
                          if(input["items"][i]["name"] == "{#GWNAME}"){
                              return input["items"][i]["stddev"] == "~" ? null : input["items"][i]["stddev"];
                          }
                      }
                - type: TRIM
                  parameters:
                    - 'ms ~'
              master_item:
                key: opnsense.gateways.status
              tags:
                - tag: component
                  value: gateway
          master_item:
            key: opnsense.gateways.status
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var input = JSON.parse(value);
                  var output = {"data": new Array()};
                  for(var i in input["items"]) {
                      output["data"].push({
                          "{#GWNAME}": input["items"][i]["name"]
                      });
                  }
                  return JSON.stringify(output);
        - uuid: f388859818ef4add9286abdfede3db5f
          name: 'Interfaces Discovery'
          type: DEPENDENT
          key: opnsense.if.discovery
          filter:
            conditions:
              - macro: '{#IFNAME}'
                value: lo0|openvpn|enc0|pfsync0|pflog0|wg
                operator: NOT_MATCHES_REGEX
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: 06c3fb36ef064a0697a6179ff92f873c
              name: 'Interface {#IFALIAS}: Incoming network traffic'
              type: DEPENDENT
              key: 'opnsense.interface.traffic.in[{#IFNAME}]'
              units: bps
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var input = JSON.parse(value);
                      var ifname = "{#IFNAME}";
                      var totalBytes = 0;
                      
                      // Search through all interface entries
                      for (var key in input.statistics) {
                          var entry = input.statistics[key];
                          
                          // Match by hardware interface name
                          if (entry.name === ifname) {
                              // Only sum entries with MAC addresses (physical layer stats)
                              if (key.indexOf("/") > -1 && key.indexOf(":") > -1) {
                                  totalBytes += parseFloat(entry["received-bytes"] || 0);
                              }
                          }
                      }
                      
                      return totalBytes;
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: opnsense.interface.statistics
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFALIAS}'
            - uuid: cc0951c383eb44dc9797397e12459bcf
              name: 'Interface {#IFALIAS}: Outgoing network traffic'
              type: DEPENDENT
              key: 'opnsense.interface.traffic.out[{#IFNAME}]'
              units: bps
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var input = JSON.parse(value);
                      var ifname = "{#IFNAME}";
                      var totalBytes = 0;
                      
                      // Search through all interface entries
                      for (var key in input.statistics) {
                          var entry = input.statistics[key];
                          
                          // Match by hardware interface name
                          if (entry.name === ifname) {
                              // Only sum entries with MAC addresses (physical layer stats)
                              if (key.indexOf("/") > -1 && key.indexOf(":") > -1) {
                                  totalBytes += parseFloat(entry["sent-bytes"] || 0);
                              }
                          }
                      }
                      
                      return totalBytes;
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: opnsense.interface.statistics
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFALIAS}'
          graph_prototypes:
            - uuid: 6feaf08dfd204c1ca93c0165c184e58f
              name: 'Interface {#IFALIAS}: Network traffic'
              ymin_type_1: FIXED
              graph_items:
                - color: 00AA00
                  calc_fnc: ALL
                  item:
                    host: OPNSENSE-BY-API
                    key: 'opnsense.interface.traffic.in[{#IFNAME}]'
                - sortorder: '1'
                  color: 3333FF
                  calc_fnc: ALL
                  item:
                    host: OPNSENSE-BY-API
                    key: 'opnsense.interface.traffic.out[{#IFNAME}]'
          master_item:
            key: opnsense.interface.statistics
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var input = JSON.parse(value);
                  var output = {"data": new Array()};
                  var interfaces = {};
                  
                  // Extract unique interfaces from the statistics
                  for (var key in input.statistics) {
                      var entry = input.statistics[key];
                      var ifname = entry.name;
                      
                      // Skip loopback and virtual interfaces
                      if (ifname && ifname !== "lo0" && ifname !== "enc0" && ifname !== "pfsync0" && ifname !== "pflog0") {
                          // Extract logical name from the key (e.g., "[WAN]", "[LAN_103]")
                          var alias = ifname;
                          var match = key.match(/^\[([^\]]+)\]/);
                          if (match) {
                              alias = match[1];
                          }
                          
                          // Only add unique interfaces
                          if (!interfaces[ifname]) {
                              interfaces[ifname] = alias;
                              output["data"].push({
                                  "{#IFNAME}": ifname,
                                  "{#IFALIAS}": alias
                              });
                          }
                      }
                  }
                  
                  return JSON.stringify(output);
        - uuid: 96d080a1cb2c47f5a19b1b6f9d5a98b4
          name: 'IPSec Discovery'
          type: DEPENDENT
          key: 'opnsense.ipsec.discovery[instances]'
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: 5dfbe85269984de8a8f8767c633f1f40
              name: 'IPSec Tunnel {#IPSECDESC} ingress traffic'
              type: DEPENDENT
              key: 'openvpn.ipsec.in[{#IPSECDESC}]'
              units: bps
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var input = JSON.parse(value);
                      bytes_count = 0;
                      for(var i in input["rows"]) {
                          var tunnel_id = "{#IPSECIKEID}";
                          if( tunnel_id == input["rows"][i]["ikeid"]) {
                              bytes_count += input["rows"][i]["bytes-in"];
                          }
                      }
                      return bytes_count;
                - type: CHANGE_PER_SECOND
              master_item:
                key: 'openvpn.ipsec.stats[{#IPSECDESC}]'
            - uuid: 5b2e0ac751f34609aea6cc62c23e03cc
              name: 'IPSec Tunnel {#IPSECDESC} egress traffic'
              type: DEPENDENT
              key: 'openvpn.ipsec.out[{#IPSECDESC}]'
              units: bps
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var input = JSON.parse(value);
                      bytes_count = 0;
                      for(var i in input["rows"]) {
                          var tunnel_id = "{#IPSECNAME}";
                          if( tunnel_id == input["rows"][i]["ikeid"]) {
                              bytes_count += input["rows"][i]["bytes-out"];
                          }
                      }
                      return bytes_count;
                - type: CHANGE_PER_SECOND
              master_item:
                key: 'openvpn.ipsec.stats[{#IPSECDESC}]'
            - uuid: 794aab3de9184cf884bc33ec9749aa8d
              name: 'IPSec Tunnel {#IPSECDESC} Phase2 status'
              type: DEPENDENT
              key: 'openvpn.ipsec.p2status[{#IPSECDESC}]'
              valuemap:
                name: 'IPSec Tunnel Status'
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var input = JSON.parse(value);
                      installed = 0;
                      installed_missing = 1;
                      p2_status = installed_missing;
                      for(var i in input["rows"]) {
                          var tunnel_id = "{#IPSECIKEID}"
                          if(tunnel_id == input["rows"][i]["ikeid"]) {
                              p2_status = input["rows"][i]["state"] == "INSTALLED" ? installed : installed_missing;
                          }
                      }
                      return p2_status;
              master_item:
                key: 'openvpn.ipsec.stats[{#IPSECDESC}]'
              trigger_prototypes:
                - uuid: a894f7cb387748faa2357394ce54da97
                  expression: 'avg(/OPNSENSE-BY-API/openvpn.ipsec.p2status[{#IPSECDESC}],3m)<>0'
                  name: 'IPSec Tunnel {#IPSECDESC} Phase2 not connected'
                  priority: AVERAGE
            - uuid: 849e04b54e544769bde5a4c5c857a54b
              name: 'IPSec Tunnel {#IPSECDESC} Phase 2 Statistics'
              type: HTTP_AGENT
              key: 'openvpn.ipsec.stats[{#IPSECDESC}]'
              history: 1d
              value_type: TEXT
              authtype: BASIC
              username: '{$APIKEY}'
              password: '{$APISECRET}'
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
              timeout: 5s
              url: '{$BASEURL}/api/ipsec/sessions/search_phase2'
              post_type: JSON
              posts: |
                {
                    "id": "{#IPSECNAME}"
                }
              request_method: POST
            - uuid: 0bcb1496eb784d8cba37b568bcd0a421
              name: 'IPSec Tunnel {#IPSECDESC} Status'
              type: DEPENDENT
              key: 'opnsense.ipsec.status[{#IPSECDESC}]'
              valuemap:
                name: 'IPSec Tunnel Status'
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var input = JSON.parse(value);
                      var connected = 0;
                      var disconnected = 1;
                      for(var i in input["rows"]) {
                          var tunnel_id = "{#IPSECIKEID}";
                          if( tunnel_id == input["rows"][i]["ikeid"]){
                              return input["rows"][i]["connected"] == true ? connected  : disconnected ;
                          }
                      }
              master_item:
                key: opnsense.ipsec.tunnels
              trigger_prototypes:
                - uuid: 1cd3354ce6c6400aaf8b4c96357f674d
                  expression: 'avg(/OPNSENSE-BY-API/opnsense.ipsec.status[{#IPSECDESC}],3m)<>0'
                  name: 'IPSec Tunnel {#IPSECDESC} not connected'
                  priority: AVERAGE
          master_item:
            key: opnsense.ipsec.tunnels
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var input = JSON.parse(value);
                  var output = {"data": new Array()};
                  for(var i in input["rows"]) {
                  	output["data"].push({
                  		"{#IPSECNAME}": input["rows"][i]["name"],
                  		"{#IPSECIKEID}": input["rows"][i]["ikeid"],
                  		"{#IPSECDESC}": input["rows"][i]["phase1desc"],
                  		"{#IPSECCONN}": input["rows"][i]["connected"]
                  	});
                  }
                  return JSON.stringify(output);
        - uuid: 82a57ed98cb54412be4c832eb121c155
          name: 'OpenVPN Discovery'
          type: DEPENDENT
          key: 'opnsense.openvpn.discovery[instances]'
          enabled_lifetime_type: DISABLE_NEVER
          item_prototypes:
            - uuid: 18acc75effc24cc682de46d10c71cab5
              name: 'OpenVPN {#VPNROLE} {#VPNDESC} ingress traffic'
              type: DEPENDENT
              key: 'opnsense.openvpn.in[{#VPNDESC}]'
              units: bps
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var input = JSON.parse(value);
                      for(var i in input["rows"]){
                          if("{#VPNDESC}" == input["rows"][i]["description"] ){
                              if( typeof input["rows"][i]["bytes_received"] !== 'undefined'){
                                  return input["rows"][i]["bytes_received"];
                              }else{
                                  return 0;
                              }
                          }
                      }
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: opnsense.openvpn.statistics
            - uuid: d57d89177f2a40cb928755f963c6f717
              name: 'OpenVPN {#VPNROLE} {#VPNDESC} egress traffic'
              type: DEPENDENT
              key: 'opnsense.openvpn.out[{#VPNDESC}]'
              units: bps
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var input = JSON.parse(value);
                      for(var i in input["rows"]){
                          if("{#VPNDESC}" == input["rows"][i]["description"] ){
                              if( typeof input["rows"][i]["bytes_sent"] !== 'undefined'){
                                  return input["rows"][i]["bytes_sent"];
                              }else{
                                  return 0;
                              }
                          }
                      }
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: opnsense.openvpn.statistics
            - uuid: 1e2738e93ccb4cc580017824e2736691
              name: 'OpenVPN {#VPNROLE} {#VPNDESC} status'
              type: DEPENDENT
              key: 'opnsense.openvpn.status[{#VPNDESC}]'
              valuemap:
                name: 'OpenVPN Status'
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var input = JSON.parse(value);
                      for(var i in input["rows"]){
                          if("{#VPNDESC}" == input["rows"][i]["description"] ){
                              switch(input["rows"][i]["status"]){
                                  case "ok":
                                      return 0;
                                      break;
                                  case "connected":
                                      return 1;
                                      break;
                                  case "auth":
                                      return 2;
                                      break;
                                  case "failed":
                                      return 3;
                                      break;
                                  case "reconnecting":
                                      return 4;
                                      break;
                                  case "wait":
                                      return 5;
                                      break;
                                  case "null":
                                      return 6;
                                      break;
                                  default:
                                      return 7;
                              }
                          }
                      }
              master_item:
                key: opnsense.openvpn.statistics
              trigger_prototypes:
                - uuid: 24c4c795345d464795b840fd26559db2
                  expression: 'min(/OPNSENSE-BY-API/opnsense.openvpn.status[{#VPNDESC}],3m)=2'
                  name: 'OpenVPN {#VPNROLE} {#VPNDESC} Disconnected'
                  priority: AVERAGE
                  tags:
                    - tag: component
                      value: vpn
                    - tag: equipment
                      value: firewall
                    - tag: product
                      value: opnsense
          master_item:
            key: opnsense.openvpn.statistics
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var input = JSON.parse(value);
                  var output = {"data": new Array()};
                  for(var i in input["rows"]) {
                  	output["data"].push({
                  		"{#VPNDESC}": input["rows"][i]["description"],
                  		"{#VPNROLE}": input["rows"][i]["type"]
                  	});
                  
                  }
                  return JSON.stringify(output);
        - uuid: f22dd398c83b4b8599d016d639811b76
          name: 'Services Discovery'
          type: DEPENDENT
          key: opnsense.service.discovery
          filter:
            conditions:
              - macro: '{#SVCID}'
                value: '^(?:dpinger.*|iperf|dhcpd6)$'
                operator: NOT_MATCHES_REGEX
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Discover running OPNsense services'
          item_prototypes:
            - uuid: a8a28b1888c548c1995424170a67280e
              name: 'Service {#SVCDESC} Status'
              type: DEPENDENT
              key: 'opnsense.service.status[{#SVCID}]'
              valuemap:
                name: 'Service Status'
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var input = JSON.parse(value);
                      for(var i in input["rows"]){
                          if("{#SVCID}" == input["rows"][i]["id"]){
                              return input["rows"][i]["running"];
                          }
                      }
              master_item:
                key: opnsense.service.get
              trigger_prototypes:
                - uuid: 12379ec34f674c07a37f2307744727d5
                  expression: 'avg(/OPNSENSE-BY-API/opnsense.service.status[{#SVCID}], 3m)<>1'
                  name: 'Service {#SVCNAME} is not running'
                  priority: WARNING
          master_item:
            key: opnsense.service.get
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var input = JSON.parse(value);
                  var output = {"data": new Array()};
                  for(var i in input["rows"]){
                      output["data"].push({
                          "{#SVCDESC}": input["rows"][i]["description"],
                          "{#SVCID}": input["rows"][i]["id"],
                          "{#SVCNAME}": input["rows"][i]["name"]
                      });
                  }
                  return JSON.stringify(output);
        - uuid: 3c0e487742714df4a24247f41b1e30bb
          name: 'Wireguard Discovery'
          type: DEPENDENT
          key: opnsense.wireguard.discovery
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Discover active Wireguard instances and peers'
          item_prototypes:
            - uuid: 4ca9e7a3bb624e198de569000cd3ee78
              name: 'Wireguard {#WGTUNNELNAME}: Peer {#WGNAME}: Incoming network traffic'
              type: DEPENDENT
              key: 'opnsense.wireguard.in[{#WGTUNNELNAME}-{#WGNAME}]'
              units: bps
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                - type: JSONPATH
                  parameters:
                    - '$.rows.[?(@.name==''{#WGNAME}'')].[''transfer-rx''].first()'
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: opnsense.wireguard.status
              tags:
                - tag: component
                  value: vpn
                - tag: instance
                  value: '{#WGTUNNELNAME}'
                - tag: peer
                  value: '{#WGNAME}'
            - uuid: 761c2bea538b477eb892c3dd8226bd01
              name: 'Wireguard {#WGTUNNELNAME}: Peer {#WGNAME} latest handshake age'
              type: DEPENDENT
              key: 'opnsense.wireguard.latesthandshake[{#WGTUNNELNAME}-{#WGNAME}]'
              units: s
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                - type: JSONPATH
                  parameters:
                    - '$.rows.[?(@.name==''{#WGNAME}'')].[''latest-handshake-age''].first()'
              master_item:
                key: opnsense.wireguard.status
              tags:
                - tag: component
                  value: vpn
                - tag: instance
                  value: '{#WGTUNNELNAME}'
                - tag: peer
                  value: '{#WGNAME}'
              trigger_prototypes:
                - uuid: f4f5b6d2f687428e9d97a98c6bbd5329
                  expression: 'last(/OPNSENSE-BY-API/opnsense.wireguard.latesthandshake[{#WGTUNNELNAME}-{#WGNAME}])>{$AGENT.TIMEOUT}'
                  name: 'Wireguard Tunnel {#WGTUNNELNAME} to {#WGNAME} now new handshake'
                  event_name: 'Wireguard Tunnel {#WGTUNNELNAME} to {#WGNAME} now new handshake (for >{$AGENT.TIMEOUT})'
                  priority: AVERAGE
                  description: 'Latest handshake older than {$AGENT.TIMEOUT}'
                  tags:
                    - tag: component
                      value: vpn
                    - tag: instance
                      value: '{#WGTUNNELNAME}'
                    - tag: peer
                      value: '{#WGNAME}'
            - uuid: 257d78f39bac4023a8ac7b01d9fcf92e
              name: 'Wireguard {#WGTUNNELNAME}: Peer {#WGNAME}: Outgoing network traffic'
              type: DEPENDENT
              key: 'opnsense.wireguard.out[{#WGTUNNELNAME}-{#WGNAME}]'
              units: bps
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                - type: JSONPATH
                  parameters:
                    - '$.rows.[?(@.name==''{#WGNAME}'')].[''transfer-tx''].first()'
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              master_item:
                key: opnsense.wireguard.status
              tags:
                - tag: component
                  value: vpn
                - tag: instance
                  value: '{#WGTUNNELNAME}'
                - tag: peer
                  value: '{#WGNAME}'
            - uuid: 3bd06d98432f4bceb054c3d85a2b5d40
              name: 'Wireguard {#WGTUNNELNAME}: Peer {#WGNAME} status'
              type: DEPENDENT
              key: 'opnsense.wireguard.status[{#WGTUNNELNAME}-{#WGNAME}]'
              valuemap:
                name: 'Wireguard Status'
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                - type: JSONPATH
                  parameters:
                    - '$.rows.[?(@.name==''{#WGNAME}'')].[''peer-status''].first()'
                - type: STR_REPLACE
                  parameters:
                    - online
                    - '0'
                - type: STR_REPLACE
                  parameters:
                    - offline
                    - '1'
                - type: STR_REPLACE
                  parameters:
                    - stale
                    - '2'
                - type: CHECK_REGEX_ERROR
                  parameters:
                    - \D+
                    - 'Unknown status, please report this issue'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '3'
              master_item:
                key: opnsense.wireguard.status
              tags:
                - tag: component
                  value: vpn
                - tag: instance
                  value: '{#WGTUNNELNAME}'
                - tag: peer
                  value: '{#WGNAME}'
              trigger_prototypes:
                - uuid: 791e1896bf29425680105a9c6589b2e1
                  expression: 'min(/OPNSENSE-BY-API/opnsense.wireguard.status[{#WGTUNNELNAME}-{#WGNAME}],#5)>0'
                  name: 'Wireguard Tunnel {#WGTUNNELNAME} to {#WGNAME} not connected'
                  priority: AVERAGE
                  description: 'None of the last 5 status reports were online (0)'
                  tags:
                    - tag: component
                      value: vpn
                    - tag: instance
                      value: '{#WGTUNNELNAME}'
                    - tag: peer
                      value: '{#WGNAME}'
          graph_prototypes:
            - uuid: 63281c2a97724a8ebba0dbca405eb8dc
              name: 'Wireguard {#WGTUNNELNAME} Peer {#WGNAME}: Network traffic'
              ymin_type_1: FIXED
              graph_items:
                - color: 00AA00
                  calc_fnc: ALL
                  item:
                    host: OPNSENSE-BY-API
                    key: 'opnsense.wireguard.in[{#WGTUNNELNAME}-{#WGNAME}]'
                - sortorder: '1'
                  color: 3333FF
                  calc_fnc: ALL
                  item:
                    host: OPNSENSE-BY-API
                    key: 'opnsense.wireguard.out[{#WGTUNNELNAME}-{#WGNAME}]'
          master_item:
            key: opnsense.wireguard.status
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var input = JSON.parse(value);
                  var output = { "data": new Array() };
                  for (var i in input["rows"]) {
                    if (input["rows"][i]["type"] === "peer") {
                      output["data"].push({
                        "{#WGNAME}": input["rows"][i]["name"],
                        "{#WGHANDSHAKE}": input["rows"][i]["latest-handshake-age"],
                        "{#WGSTATUS}": input["rows"][i]["peer-status"],
                        "{#WGRX}": input["rows"][i]["transfer-rx"],
                        "{#WGTX}": input["rows"][i]["transfer-tx"],
                        "{#WGTUNNELNAME}": input["rows"][i]["ifname"],
                      });
                    };
                  };
                  return JSON.stringify(output);
      tags:
        - tag: class
          value: software
        - tag: target
          value: opnsense
      macros:
        - macro: '{$AGENT.TIMEOUT}'
          value: 3m
          description: 'Timeout after which the agent is considered unavailable. Works only for agents reachable from Zabbix server/proxy (in passive mode).'
        - macro: '{$APIKEY}'
          value: SET_API_KEY
          description: 'API Key'
        - macro: '{$APISECRET}'
          value: SET_API_SECRET
          description: 'API Secret'
        - macro: '{$BASEURL}'
          value: 'https://127.0.0.1:8443'
          description: 'URL for WebUI, e.g. https://127.0.0.1 for the local agent'
        - macro: '{$FIREWALL.CHANGE.THRESHOLD}'
          value: '50'
          description: 'Percentage threshold for firewall action changes'
      valuemaps:
        - uuid: 9505857b9b4340a29222ee79348bbd2f
          name: 'Gateway Status'
          mappings:
            - value: '0'
              newvalue: online
            - value: '1'
              newvalue: loss
            - value: '2'
              newvalue: delay
            - value: '3'
              newvalue: delay+loss
            - value: '4'
              newvalue: down
            - value: '5'
              newvalue: force_down
        - uuid: e456b49d84c74ffc83d10f658f4b7fd5
          name: 'IPSec Tunnel Status'
          mappings:
            - value: '0'
              newvalue: connected
            - type: DEFAULT
              newvalue: disconnected
        - uuid: 512b933c3f144785acd8272e77dd6fe8
          name: 'OpenVPN Status'
          mappings:
            - value: '0'
              newvalue: ok
            - value: '1'
              newvalue: connected
            - value: '2'
              newvalue: auth
            - value: '3'
              newvalue: failed
            - value: '4'
              newvalue: reconnecting
            - value: '5'
              newvalue: wait
            - value: '6'
              newvalue: disconnected
            - value: '7'
              newvalue: unknown
        - uuid: 3871d4e1a58947a8ba5e86add21e3aed
          name: 'Service Status'
          mappings:
            - value: '1'
              newvalue: running
            - value: '0'
              newvalue: stopped
        - uuid: 8b9354678f004bcd8c4c43820663d109
          name: 'Wireguard Status'
          mappings:
            - value: '0'
              newvalue: online
            - value: '1'
              newvalue: offline
            - value: '2'
              newvalue: stale
  triggers:
    - uuid: 65237821f48d491da7d84ab8c5d20217
      expression: 'last(/OPNSENSE-BY-API/opnsense.firmware.current) <> last(/OPNSENSE-BY-API/opnsense.firmware.latest)'
      name: 'New Firmware available'
      opdata: 'Current:{ITEM.VALUE1} New:{ITEM.VALUE2}'
      priority: INFO
